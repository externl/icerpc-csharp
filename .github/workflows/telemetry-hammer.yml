name: Telemetry hammer

# Opens fresh QUIC connections to build-telemetry.icerpc.dev, through the real build path and through a bare
# IceRPC connect-and-close probe, with a packet capture on the runner, to catch the connect timeout that CI
# hits about once in 80 runs.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to hammer
        default: "240"
      runners:
        description: JSON list of runner labels
        default: '["ubuntu-24.04", "macos-26", "windows-2025-vs2026"]'
      interval:
        description: Seconds to wait between builds
        default: "2"
      probe_streams:
        description: Concurrent probe processes per runner
        default: "2"
      probe_parallel:
        description: Connections each probe process opens at once
        default: "1"
      probe_rounds:
        description: Rounds per probe process
        default: "1"
      probe_interval:
        description: Seconds between probe processes in a stream
        default: "0.5"
      probe_fill:
        description: Idle UDP flows to hold open beside the probe, to occupy NAT mappings
        default: "0"
      jobs:
        description: Which jobs to run — hammer, probe, burst
        default: "hammer,probe"
      burst_rate:
        description: burst job — connections per second, held constant across phases
        default: "5"
      burst_sizes:
        description: burst job — burst sizes to walk, in order
        default: "1 2 3 4 5 6"

env:
  IceRpcBuildTelemetryDebug: true
  IceRpcBuildTelemetryDryRun: true

jobs:
  hammer:
    if: contains(inputs.jobs, 'hammer')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - name: Publish Local Packages
        run: ./build/publish-local-packages.sh
        shell: bash
      - name: Describe the network
        run: |
          echo "egress IP: $(curl -fsS https://checkip.amazonaws.com)"
          echo "target:    build-telemetry.icerpc.dev -> $(dig +short build-telemetry.icerpc.dev A 2>/dev/null | tr '\n' ' ')"
          case "$RUNNER_OS" in
            Linux) dpkg -s libmsquic | grep '^Version' ;;
            macOS) brew list --versions libmsquic ;;
            Windows) ls "$DOTNET_ROOT"/shared/Microsoft.NETCore.App/*/msquic.dll ;;
          esac
        shell: bash
      - name: Start packet capture
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then iface=any; else iface=$(route -n get default | awk '/interface:/{print $2}'); fi
          sudo sh -c "tcpdump -i $iface -nn -s 120 -U -Z root -w $RUNNER_TEMP/hammer.pcap 'port 4062 or port 53 or icmp' >$RUNNER_TEMP/tcpdump.log 2>&1 &"
          sleep 1
          cat "$RUNNER_TEMP/tcpdump.log"
        shell: bash
      - name: Start packet capture (Windows)
        if: runner.os == 'Windows'
        run: |
          pktmon filter remove
          pktmon filter add -p 4062
          pktmon filter add -p 53
          pktmon filter add -t icmp
          pktmon start --capture --pkt-size 120 --file-name "$env:RUNNER_TEMP\hammer.etl"
        shell: pwsh
      - name: Warm up and verify debug mode
        run: |
          IceRpcVersion=$(sed -n 's/.*<Version[^>]*>\(.*\)<\/Version>.*/\1/p' build/IceRpc.Version.props)
          echo "IceRpcVersion=$IceRpcVersion" >> "$GITHUB_ENV"
          export IceRpcVersion
          dotnet build examples/protobuf/MultipleServices/MultipleServices.slnx
          # The generator writes this file only in debug mode, the mode in which a failed report fails the build.
          find examples/protobuf/MultipleServices -name '*.BuildTelemetry.txt' | grep -q . \
            || { echo "::error::build telemetry is not running in debug mode"; exit 1; }
        shell: bash
      - name: Hammer
        env:
          MINUTES: ${{ inputs.minutes }}
          INTERVAL: ${{ inputs.interval }}
        run: |
          set -u
          now() { perl -MTime::HiRes=time -MPOSIX=strftime -e '$t=time; printf("%s.%03dZ", strftime("%Y-%m-%dT%H:%M:%S", gmtime($t)), ($t-int($t))*1000)'; }
          solution=examples/protobuf/MultipleServices/MultipleServices.slnx
          log="$RUNNER_TEMP/hammer.log"
          failures="$RUNNER_TEMP/failures.log"
          : > "$log"; : > "$failures"
          end=$(( $(date +%s) + MINUTES * 60 ))
          i=0; failed=0
          while [ "$(date +%s)" -lt "$end" ]; do
            i=$((i + 1))
            # A newer .proto makes ProtoCompile run protoc again, so every build reports telemetry.
            touch examples/protobuf/MultipleServices/proto/*/*.proto
            start=$(now)
            if out=$(dotnet build "$solution" 2>&1); then status=ok; else status=FAIL; failed=$((failed + 1)); fi
            finish=$(now)
            echo "$i $start $finish $status" >> "$log"
            if [ "$status" = FAIL ]; then
              printf '=== iteration %s  %s -> %s\n%s\n\n' "$i" "$start" "$finish" "$out" >> "$failures"
              echo "::warning::iteration $i failed at $start"
            fi
            sleep "$INTERVAL"
          done
          echo "iterations=$i failed=$failed"
          [ "$failed" -eq 0 ]
        shell: bash
      - name: Stop packet capture
        if: always() && runner.os != 'Windows'
        run: |
          sudo pkill -INT tcpdump || true
          sleep 2
          ls -la "$RUNNER_TEMP"/hammer.pcap
        shell: bash
      - name: Stop packet capture (Windows)
        if: always() && runner.os == 'Windows'
        run: |
          pktmon stop
          pktmon etl2pcap "$env:RUNNER_TEMP\hammer.etl" --out "$env:RUNNER_TEMP\hammer.pcap"
          Get-Item "$env:RUNNER_TEMP\hammer.pcap"
        shell: pwsh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hammer-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hammer.pcap
            ${{ runner.temp }}/hammer.log
            ${{ runner.temp }}/failures.log
            ${{ runner.temp }}/tcpdump.log

  probe:
    if: contains(inputs.jobs, 'probe')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - name: Build the probe
        run: dotnet build src/IceRpc.BuildTelemetry.Probe
      - name: Describe the network
        run: |
          echo "egress IP: $(curl -fsS https://checkip.amazonaws.com)"
          echo "target:    build-telemetry.icerpc.dev -> $(dig +short build-telemetry.icerpc.dev A 2>/dev/null | tr '\n' ' ')"
          case "$RUNNER_OS" in
            Linux) dpkg -s libmsquic | grep '^Version' ;;
            macOS) brew list --versions libmsquic ;;
            Windows) ls "$DOTNET_ROOT"/shared/Microsoft.NETCore.App/*/msquic.dll ;;
          esac
        shell: bash
      - name: Start packet capture
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then iface=any; else iface=$(route -n get default | awk '/interface:/{print $2}'); fi
          sudo sh -c "tcpdump -i $iface -nn -s 120 -U -Z root -w $RUNNER_TEMP/probe.pcap 'port 4062 or port 53 or icmp' >$RUNNER_TEMP/tcpdump.log 2>&1 &"
          sleep 1
          cat "$RUNNER_TEMP/tcpdump.log"
        shell: bash
      - name: Start packet capture (Windows)
        if: runner.os == 'Windows'
        run: |
          pktmon filter remove
          pktmon filter add -p 4062
          pktmon filter add -p 53
          pktmon filter add -t icmp
          pktmon start --capture --pkt-size 120 --file-name "$env:RUNNER_TEMP\probe.etl"
        shell: pwsh
      - name: Probe
        env:
          MINUTES: ${{ inputs.minutes }}
          STREAMS: ${{ inputs.probe_streams }}
          PARALLEL: ${{ inputs.probe_parallel }}
          ROUNDS: ${{ inputs.probe_rounds }}
          INTERVAL: ${{ inputs.probe_interval }}
          FILL: ${{ inputs.probe_fill }}
        run: |
          set -u
          probe="dotnet src/IceRpc.BuildTelemetry.Probe/bin/Debug/net10.0/IceRpc.BuildTelemetry.Probe.dll"
          if [ "$FILL" -gt 0 ]; then
            $probe --fill "$FILL" --hold $((MINUTES * 60 + 120)) > "$RUNNER_TEMP/fill.log" 2>&1 &
            sleep 5; cat "$RUNNER_TEMP/fill.log"
          fi
          log="$RUNNER_TEMP/probe.log"
          failures="$RUNNER_TEMP/probe-failures.log"
          : > "$log"; : > "$failures"
          end=$(( $(date +%s) + MINUTES * 60 ))
          # STREAMS concurrent streams; each process runs ROUNDS rounds of PARALLEL concurrent connect-and-close, then
          # exits. A failed or slow connect is followed at once by fresh single QUIC flows, a TCP connect, and pings,
          # to tell a dead flow from a dead path from a dead transport.
          stream() {
            out="$RUNNER_TEMP/probe-out.$1.txt"
            while [ "$(date +%s)" -lt "$end" ]; do
              $probe --timeout 60 --parallel "$PARALLEL" --count "$ROUNDS" > "$out" 2>&1 || true
              cat "$out" >> "$log"
              if bad=$(grep -E 'result=FAIL|connect_ms=([2-9][0-9]{3}|[0-9]{5,})' "$out"); then
                echo "::warning::probe: $(printf '%s' "$bad" | head -1)"
                {
                  printf '=== %s\n' "$bad"
                  for _ in 1 2 3; do $probe --timeout 60 & done
                  $probe --timeout 60 --transport tcp &
                  if [ "$RUNNER_OS" = Windows ]; then ping -n 3 build-telemetry.icerpc.dev & else ping -c 3 build-telemetry.icerpc.dev & fi
                  wait
                  echo
                } >> "$failures" 2>&1
              fi
              sleep "$INTERVAL"
            done
          }
          for s in $(seq 1 "$STREAMS"); do stream "$s" & done
          wait
          echo "attempts=$(grep -c '^PROBE' "$log") failed=$(grep -c 'result=FAIL' "$log")"
          [ "$(grep -c 'result=FAIL' "$log")" -eq 0 ]
        shell: bash
      - name: Stop packet capture
        if: always() && runner.os != 'Windows'
        run: |
          sudo pkill -INT tcpdump || true
          sleep 2
          ls -la "$RUNNER_TEMP"/probe.pcap
        shell: bash
      - name: Stop packet capture (Windows)
        if: always() && runner.os == 'Windows'
        run: |
          pktmon stop
          pktmon etl2pcap "$env:RUNNER_TEMP\probe.etl" --out "$env:RUNNER_TEMP\probe.pcap"
          Get-Item "$env:RUNNER_TEMP\probe.pcap"
        shell: pwsh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/probe.pcap
            ${{ runner.temp }}/probe.log
            ${{ runner.temp }}/probe-failures.log
            ${{ runner.temp }}/fill.log
            ${{ runner.temp }}/tcpdump.log

  burst:
    if: contains(inputs.jobs, 'burst')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - name: Build the probe
        run: dotnet build src/IceRpc.BuildTelemetry.Probe
      - name: Describe the network
        run: |
          echo "egress IP: $(curl -fsS https://checkip.amazonaws.com)"
          echo "target:    build-telemetry.icerpc.dev -> $(dig +short build-telemetry.icerpc.dev A 2>/dev/null | tr '\n' ' ')"
          case "$RUNNER_OS" in
            Linux) dpkg -s libmsquic | grep '^Version' ;;
            macOS) brew list --versions libmsquic ;;
            Windows) ls "$DOTNET_ROOT"/shared/Microsoft.NETCore.App/*/msquic.dll ;;
          esac
        shell: bash
      - name: Start packet capture
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then iface=any; else iface=$(route -n get default | awk '/interface:/{print $2}'); fi
          sudo sh -c "tcpdump -i $iface -nn -s 120 -U -Z root -w $RUNNER_TEMP/burst.pcap 'port 4062 or port 53 or icmp' >$RUNNER_TEMP/tcpdump.log 2>&1 &"
          sleep 1
          cat "$RUNNER_TEMP/tcpdump.log"
        shell: bash
      - name: Start packet capture (Windows)
        if: runner.os == 'Windows'
        run: |
          pktmon filter remove
          pktmon filter add -p 4062
          pktmon filter add -p 53
          pktmon filter add -t icmp
          pktmon start --capture --pkt-size 120 --file-name "$env:RUNNER_TEMP\burst.etl"
        shell: pwsh
      - name: Walk the burst sizes
        env:
          MINUTES: ${{ inputs.minutes }}
          RATE: ${{ inputs.burst_rate }}
          SIZES: ${{ inputs.burst_sizes }}
        run: |
          set -u
          probe="dotnet src/IceRpc.BuildTelemetry.Probe/bin/Debug/net10.0/IceRpc.BuildTelemetry.Probe.dll"
          log="$RUNNER_TEMP/burst.log"
          : > "$log"
          # One phase per burst size, in sequence on this one runner. The round cadence is scaled by the burst size,
          # so every phase opens the same connections per second and only the burst size differs.
          # shellcheck disable=SC2086 # SIZES is a list of burst sizes, split on purpose
          set -- $SIZES
          phase_minutes=$(( MINUTES / $# ))
          for burst in $SIZES; do
            interval=$(( burst * 1000 / RATE ))
            rounds=$(( phase_minutes * 60 * 1000 / interval ))
            echo "PHASE burst=$burst interval_ms=$interval rounds=$rounds rate=$RATE start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$log"
            $probe --timeout 60 --parallel "$burst" --count "$rounds" --round-interval "$interval" >> "$log" 2>&1 || true
          done
          echo "=== per phase ==="
          awk '/^PHASE/{b=$2; a[b]=0; f[b]=0; order[++n]=b} /^PROBE/{a[b]++; if ($0 ~ /result=FAIL/) f[b]++} END {for (i=1;i<=n;i++) printf "  %s attempts=%d failed=%d\n", order[i], a[order[i]], f[order[i]]}' "$log"
        shell: bash
      - name: Stop packet capture
        if: always() && runner.os != 'Windows'
        run: sudo pkill -INT tcpdump || true
        shell: bash
      - name: Stop packet capture (Windows)
        if: always() && runner.os == 'Windows'
        run: |
          pktmon stop
          pktmon etl2pcap "$env:RUNNER_TEMP\burst.etl" --out "$env:RUNNER_TEMP\burst.pcap"
        shell: pwsh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burst-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/burst.pcap
            ${{ runner.temp }}/burst.log
            ${{ runner.temp }}/tcpdump.log
